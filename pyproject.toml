[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aleph"
version = "0.2.3"
description = "Overlay semitransparente con guías de composición (tercios, centro, diagonales, áurea) para estudiar fotografía de películas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas Lassa", email = "lassall.ph@gmail.com" }]
keywords = ["composition", "cinematography", "overlay", "guides", "rule-of-thirds", "pyside6"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6.0",
    "ruff>=0.6",
    # Pillow no es dependencia de PyInstaller, pero la necesita para
    # convertir el PNG del ícono a .ico (Windows) y .icns (macOS).
    "pillow>=10.0",
]

[project.scripts]
aleph = "src.main:main"

[project.urls]
Homepage = "https://github.com/LucasLassa/aleph"
Repository = "https://github.com/LucasLassa/aleph"
Issues = "https://github.com/LucasLassa/aleph/issues"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
# El ícono y la fuente del panel tienen que viajar dentro del paquete
# para que existan tanto en `pip install` como en el binario congelado.
"src" = ["resources/*.png", "resources/*.otf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
